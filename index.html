<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>브랜드 메뉴 관리 대시보드</title>
    
    <!-- 필수 라이브러리 CDN (React, Babel, Tailwind CSS) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* 스크롤바 등 기본 UI 디자인 개선 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- React 앱이 렌더링될 공간 -->
    <div id="root"></div>

    <!-- 핵심 로직 및 UI 코드 -->
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        // 아이콘 모음 (외부 이미지 없이 순수 코드로 구현)
        const Icons = {
            Image: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            Trash2: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            ChevronUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>,
            ChevronDown: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        };

        const CATEGORIES = ['전체', '세트', '단품', '사이드', '음료', '주류'];
        
        const DEFAULT_BRANDS = [
            { id: 'brand1', name: '브랜드 A', color: '#EF4444' },
            { id: 'brand2', name: '브랜드 B', color: '#3B82F6' },
            { id: 'brand3', name: '브랜드 C', color: '#10B981' },
            { id: 'brand4', name: '브랜드 D', color: '#F59E0B' }
        ];

        // --- 메뉴 카드 컴포넌트 ---
        const MenuCard = ({ item, onUpdate, onDelete, onMoveUp, onMoveDown, isFirst, isLast }) => {
            const [isEditing, setIsEditing] = useState(null);
            const [editValue, setEditValue] = useState('');

            const handleEditStart = (field, value) => { setIsEditing(field); setEditValue(value); };
            const handleEditComplete = (field) => { if (isEditing) { onUpdate(item.id, field, editValue); setIsEditing(null); } };
            const handleKeyDown = (e, field) => { if (e.key === 'Enter') handleEditComplete(field); if (e.key === 'Escape') setIsEditing(null); };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 500;
                        let scaleSize = 1;
                        if(img.width > MAX_WIDTH) scaleSize = MAX_WIDTH / img.width;
                        canvas.width = img.width * scaleSize;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        onUpdate(item.id, 'image', canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleDownloadImage = (e) => {
                e.preventDefault(); e.stopPropagation();
                if (!item.image) return;
                const a = document.createElement('a');
                a.href = item.image;
                a.download = `${item.name || 'menu'}_image.jpg`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            };

            return (
                <div className="group flex flex-col md:flex-row bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition-shadow relative">
                    <div className="flex md:flex-col justify-center items-center p-2 md:p-3 bg-gray-50 border-b md:border-b-0 md:border-r border-gray-100 gap-2 md:gap-1">
                        <button onClick={() => onMoveUp(item)} disabled={isFirst} className={`p-1.5 rounded hover:bg-gray-200 transition-colors ${isFirst ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:text-gray-800'}`}><Icons.ChevronUp /></button>
                        <button onClick={() => onMoveDown(item)} disabled={isLast} className={`p-1.5 rounded hover:bg-gray-200 transition-colors ${isLast ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:text-gray-800'}`}><Icons.ChevronDown /></button>
                    </div>

                    <div className="w-full md:w-48 h-48 md:h-auto bg-gray-100 relative flex-shrink-0 group/img border-b md:border-b-0 md:border-r border-gray-100">
                        {item.image ? (
                            <img src={item.image} alt="메뉴" className="w-full h-full object-cover" />
                        ) : (
                            <div className="w-full h-full flex flex-col items-center justify-center text-gray-400">
                                <Icons.Image />
                                <span className="text-xs mt-2 font-medium">이미지 없음</span>
                            </div>
                        )}
                        <label className="absolute inset-0 bg-black/50 opacity-0 group-hover/img:opacity-100 flex items-center justify-center text-white text-sm font-medium cursor-pointer transition-opacity backdrop-blur-[2px]">
                            클릭하여 변경
                            <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                        </label>
                        {item.image && (
                            <button onClick={handleDownloadImage} className="absolute top-3 left-3 z-10 p-2 bg-white/90 hover:bg-white text-gray-800 rounded-lg shadow-sm opacity-0 group-hover/img:opacity-100 transition-all focus:outline-none" title="원본 이미지 다운로드">
                                <Icons.Download />
                            </button>
                        )}
                    </div>

                    <div className="flex-1 p-5 flex flex-col md:flex-row gap-4 md:gap-6 items-start md:items-center">
                        <div className="flex-1 w-full space-y-3">
                            <div className="flex flex-col gap-1.5">
                                <select 
                                    value={item.category} onChange={(e) => onUpdate(item.id, 'category', e.target.value)}
                                    className="text-xs font-semibold text-gray-500 bg-gray-100 rounded-md px-2 py-1 w-max border-none focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer"
                                >
                                    {CATEGORIES.filter(c => c !== '전체').map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                                
                                {isEditing === 'name' ? (
                                    <input type="text" autoFocus value={editValue} onChange={(e) => setEditValue(e.target.value)} onBlur={() => handleEditComplete('name')} onKeyDown={(e) => handleKeyDown(e, 'name')} className="text-xl font-bold border-b-2 border-blue-500 outline-none bg-transparent px-1 py-0.5 w-full text-gray-900" placeholder="메뉴명 입력" />
                                ) : (
                                    <h3 onClick={() => handleEditStart('name', item.name)} className="text-xl font-bold text-gray-900 cursor-text hover:bg-gray-50 px-1 py-0.5 rounded -ml-1 inline-block transition-colors min-h-[32px]">{item.name || '메뉴명 입력...'}</h3>
                                )}
                            </div>
                            {isEditing === 'description' ? (
                                <textarea autoFocus value={editValue} onChange={(e) => setEditValue(e.target.value)} onBlur={() => handleEditComplete('description')} onKeyDown={(e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleEditComplete('description'); } }} className="text-sm text-gray-600 border-2 border-blue-500 outline-none rounded-lg bg-white p-2 w-full resize-none shadow-sm" placeholder="메뉴 설명을 입력하세요" rows="2" />
                            ) : (
                                <p onClick={() => handleEditStart('description', item.description)} className="text-sm text-gray-500 cursor-text hover:bg-gray-50 px-1 py-1 rounded -ml-1 transition-colors min-h-[24px] line-clamp-2">{item.description || '설명을 입력하려면 클릭하세요...'}</p>
                            )}
                        </div>
                        <div className="flex md:flex-col items-center md:items-end justify-between w-full md:w-auto gap-4 pt-4 md:pt-0 border-t md:border-t-0 border-gray-100">
                            <div className="text-right flex items-center bg-gray-50 px-3 py-2 rounded-xl border border-gray-100">
                                {isEditing === 'price' ? (
                                    <div className="flex items-center gap-1">
                                        <input type="number" autoFocus value={editValue} onChange={(e) => setEditValue(e.target.value)} onBlur={() => handleEditComplete('price')} onKeyDown={(e) => handleKeyDown(e, 'price')} className="text-xl font-bold text-right w-24 border-b-2 border-blue-500 outline-none bg-transparent px-1 py-0.5 text-gray-900" placeholder="0" />
                                        <span className="font-bold text-gray-800">원</span>
                                    </div>
                                ) : (
                                    <div onClick={() => handleEditStart('price', item.price)} className="cursor-text hover:bg-gray-100 px-2 py-1 rounded transition-colors group/price flex items-center gap-1">
                                        <span className="text-xl font-bold text-gray-900 group-hover/price:text-blue-600 transition-colors">{item.price ? Number(item.price).toLocaleString() : '0'}</span>
                                        <span className="font-bold text-gray-800">원</span>
                                    </div>
                                )}
                            </div>
                            <button onClick={() => onDelete(item.id)} className="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors flex items-center gap-1.5 text-sm font-medium">
                                <Icons.Trash2 />
                                <span className="md:hidden">삭제</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 메인 대시보드 컴포넌트 ---
        function App() {
            const [brands, setBrands] = useState(DEFAULT_BRANDS);
            const [activeBrand, setActiveBrand] = useState('brand1');
            const [menuItems, setMenuItems] = useState([]);
            const [activeCategory, setActiveCategory] = useState('전체');
            const [isBrandModalOpen, setIsBrandModalOpen] = useState(false);
            const [editingBrands, setEditingBrands] = useState([...DEFAULT_BRANDS]);

            // 내 브라우저 로컬 데이터 불러오기
            useEffect(() => {
                const savedBrands = localStorage.getItem('menuManager_brands_standalone');
                const savedItems = localStorage.getItem('menuManager_items_standalone');
                if (savedBrands) setBrands(JSON.parse(savedBrands));
                if (savedItems) setMenuItems(JSON.parse(savedItems));
            }, []);

            // 변경 시 브라우저 로컬 데이터 자동 저장
            useEffect(() => {
                localStorage.setItem('menuManager_brands_standalone', JSON.stringify(brands));
                localStorage.setItem('menuManager_items_standalone', JSON.stringify(menuItems));
            }, [brands, menuItems]);

            const currentBrand = brands.find(b => b.id === activeBrand) || brands[0];
            const currentBrandItems = menuItems.filter(item => item.brandId === activeBrand).sort((a, b) => (a.order || 0) - (b.order || 0));
            const filteredItems = activeCategory === '전체' ? currentBrandItems : currentBrandItems.filter(item => item.category === activeCategory);

            const handleAddItem = () => {
                const maxOrder = currentBrandItems.length > 0 ? Math.max(...currentBrandItems.map(i => i.order || 0)) : 0;
                setMenuItems([...menuItems, { id: Date.now().toString(), brandId: activeBrand, name: '', category: activeCategory === '전체' ? '세트' : activeCategory, description: '', price: '', image: null, order: maxOrder + 1 }]);
            };

            const handleUpdateItem = (id, field, value) => setMenuItems(items => items.map(item => item.id === id ? { ...item, [field]: value } : item));
            
            const handleDeleteItem = (id) => { if(window.confirm('이 메뉴를 삭제하시겠습니까?')) setMenuItems(items => items.filter(item => item.id !== id)); };

            const handleMoveOrder = (item, direction) => {
                const currentIndex = currentBrandItems.findIndex(i => i.id === item.id);
                const targetIndex = direction === 'up' ? currentIndex - 1 : currentIndex + 1;
                
                if (targetIndex >= 0 && targetIndex < currentBrandItems.length) {
                    const targetItem = currentBrandItems[targetIndex];
                    const newItems = [...menuItems];
                    const item1 = newItems.find(i => i.id === item.id);
                    const item2 = newItems.find(i => i.id === targetItem.id);
                    [item1.order, item2.order] = [item2.order, item1.order];
                    setMenuItems(newItems);
                }
            };

            const openBrandModal = () => { setEditingBrands([...brands]); setIsBrandModalOpen(true); };
            const handleSaveBrands = () => { setBrands(editingBrands); setIsBrandModalOpen(false); };

            return (
                <div className="min-h-screen pb-20">
                    <header className="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-end h-16">
                                <div className="flex space-x-1 sm:space-x-4 overflow-x-auto pb-[-1px] scrollbar-hide">
                                    {brands.map((brand) => (
                                        <button key={brand.id} onClick={() => setActiveBrand(brand.id)} className={`px-3 sm:px-4 py-3 sm:py-4 border-b-2 font-medium text-sm sm:text-base whitespace-nowrap transition-colors ${activeBrand === brand.id ? 'text-gray-900' : 'text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300'}`} style={activeBrand === brand.id ? { borderColor: brand.color, color: brand.color } : {}}>
                                            {brand.name}
                                        </button>
                                    ))}
                                </div>
                                <div className="py-3 pl-4 border-l border-gray-100 flex-shrink-0">
                                    <button onClick={openBrandModal} className="text-gray-500 hover:text-gray-800 flex items-center gap-1 text-sm font-medium transition-colors p-1.5 rounded-lg hover:bg-gray-100">
                                        <Icons.Settings /> <span className="hidden sm:inline">브랜드 설정</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                            <div className="flex gap-2 bg-white p-1.5 rounded-xl shadow-sm border border-gray-100 overflow-x-auto w-full sm:w-auto">
                                {CATEGORIES.map(category => (
                                    <button key={category} onClick={() => setActiveCategory(category)} className={`px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-all ${activeCategory === category ? 'bg-gray-900 text-white shadow-sm' : 'text-gray-600 hover:bg-gray-100'}`} style={activeCategory === category ? { backgroundColor: currentBrand.color } : {}}>
                                        {category}
                                    </button>
                                ))}
                            </div>
                            <button onClick={handleAddItem} className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-white font-medium shadow-sm hover:shadow transition-all w-full sm:w-auto justify-center" style={{ backgroundColor: currentBrand.color }}>
                                <Icons.Plus /> 새 메뉴 등록
                            </button>
                        </div>

                        {filteredItems.length === 0 ? (
                            <div className="text-center py-20 bg-white rounded-3xl border border-dashed border-gray-300 shadow-sm">
                                <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-50 mb-4 text-gray-400"><Icons.Image /></div>
                                <h3 className="text-xl font-bold text-gray-900 mb-2">등록된 메뉴가 없습니다</h3>
                                <p className="text-gray-500 mb-6 text-sm sm:text-base">새로운 메뉴를 추가하여 리스트를 채워보세요.</p>
                                <button onClick={handleAddItem} className="font-semibold text-sm px-6 py-2.5 rounded-full border-2 transition-colors" style={{ borderColor: currentBrand.color, color: currentBrand.color }}>+ 첫 번째 메뉴 추가하기</button>
                            </div>
                        ) : (
                            <div className="flex flex-col gap-4">
                                {filteredItems.map((item, index) => (
                                    <MenuCard key={item.id} item={item} onUpdate={handleUpdateItem} onDelete={handleDeleteItem} onMoveUp={(item) => handleMoveOrder(item, 'up')} onMoveDown={(item) => handleMoveOrder(item, 'down')} isFirst={index === 0} isLast={index === filteredItems.length - 1} />
                                ))}
                            </div>
                        )}
                    </main>

                    {/* 모달 */}
                    {isBrandModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden">
                                <div className="flex justify-between items-center p-6 border-b border-gray-100 bg-gray-50/50">
                                    <h2 className="text-xl font-bold text-gray-900">브랜드 설정</h2>
                                    <button onClick={() => setIsBrandModalOpen(false)} className="text-gray-400 hover:text-gray-700 p-1 rounded-lg hover:bg-gray-100"><Icons.X /></button>
                                </div>
                                <div className="p-6 space-y-4">
                                    {editingBrands.map((brand, index) => (
                                        <div key={brand.id} className="flex gap-3 items-center">
                                            <span className="w-6 text-sm font-bold text-gray-400 text-center">{index + 1}</span>
                                            <input type="text" value={brand.name} onChange={(e) => { const newBrands = [...editingBrands]; newBrands[index].name = e.target.value; setEditingBrands(newBrands); }} className="flex-1 border border-gray-200 rounded-lg px-3 py-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none" placeholder="브랜드명" />
                                            <input type="color" value={brand.color} onChange={(e) => { const newBrands = [...editingBrands]; newBrands[index].color = e.target.value; setEditingBrands(newBrands); }} className="w-10 h-10 rounded-lg cursor-pointer border-0 p-0 shadow-sm" />
                                        </div>
                                    ))}
                                    <div className="pt-4 flex gap-3">
                                        <button onClick={() => setIsBrandModalOpen(false)} className="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 text-gray-700 font-medium hover:bg-gray-50">취소</button>
                                        <button onClick={handleSaveBrands} className="flex-1 px-4 py-2.5 rounded-xl bg-gray-900 text-white font-medium hover:bg-gray-800 shadow-sm">저장하기</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
